<svg xmlns="http://www.w3.org/2000/svg" class="feed-flow" viewBox="0 0 1000 740" role="img" aria-labelledby="flow-title flow-description"><style>.flow-node rect{fill:#172d38;stroke:#658895;stroke-width:2}.flow-node text{fill:#edf2f5;text-anchor:middle;font-size:17px;font-family:system-ui}.flow-node .flow-small{font-size:12px}.flow-node .flow-start{fill:#ffe29a;font-size:14px;font-weight:800}.flow-play rect{fill:#185943;stroke:#7be0af}.flow-delete rect{fill:#702c38;stroke:#ff96a4}.flow-edges{stroke:#adc1cf;stroke-width:2}.flow-labels text,.flow-notes text{fill:#c4d7df;font:13px system-ui}.flow-notes text{font-size:15px}</style><rect width="1000" height="740" rx="12" fill="#101923"/><title id="flow-title">Antennarr feed flow</title><desc id="flow-description">Start with the input queue. Auditions fill channel rosters. Roster streams are checked in repeated passes. Failures return to the queue until their deletion threshold is reached. Active channels supply Plex through a primary feed and a hot backup.</desc><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#adc1cf"/></marker></defs>
<g class="flow-edges" fill="none" marker-end="url(#flow-arrow)"><path d="M205 95H270"/><path d="M480 95H550"/><path d="M760 95H815"/><path d="M655 135V255"/><path d="M550 295H480"/><path d="M375 135V180H240V510H550"/><path d="M375 335V430H655V470"/><path d="M760 510H815"/><path d="M655 550V575H105V135"/><path d="M760 295H790V155H720V135"/></g>
<g class="flow-labels"><text x="510" y="80">Pass</text><text x="788" y="40" text-anchor="middle">Watch</text><text x="670" y="200">Check</text><text x="505" y="280">Fail</text><text x="250" y="205">Fail</text><text x="800" y="220">Pass</text><text x="788" y="450" text-anchor="middle">Limit reached</text><text x="205" y="595">Below limit: return randomly</text></g>
<g class="flow-node"><rect x="20" y="55" width="185" height="80" rx="12"/><text x="112" y="82" class="flow-start">START HERE</text><text x="112" y="108">Input queue</text></g>
<g class="flow-node"><rect x="270" y="55" width="210" height="80" rx="12"/><text x="375" y="88">Audition streams</text><text x="375" y="113" class="flow-small">Fill vacant roster places</text></g>
<g class="flow-node"><rect x="550" y="55" width="210" height="80" rx="12"/><text x="655" y="88">Channel rosters</text><text x="655" y="113" class="flow-small">Verified alternatives</text></g>
<g class="flow-node flow-play"><rect x="815" y="55" width="165" height="80" rx="12"/><text x="897" y="88">Plex playback</text><text x="897" y="113" class="flow-small">Primary + hot backup</text></g>
<g class="flow-node"><rect x="550" y="255" width="210" height="80" rx="12"/><text x="655" y="288">Roster checks</text><text x="655" y="313" class="flow-small">Continuous saved passes</text></g>
<g class="flow-node"><rect x="270" y="255" width="210" height="80" rx="12"/><text x="375" y="288">Remove roster place</text><text x="375" y="313" class="flow-small">Recruit a replacement</text></g>
<g class="flow-node"><rect x="550" y="470" width="210" height="80" rx="12"/><text x="655" y="503">Failure counter</text><text x="655" y="528" class="flow-small">Separate account/stream limits</text></g>
<g class="flow-node flow-delete"><rect x="815" y="470" width="165" height="80" rx="12"/><text x="897" y="503">Delete from</text><text x="897" y="528">database</text></g>
<g class="flow-notes"><text x="20" y="630">Import authorised list URLs to add accounts. Full rosters pause recruitment.</text><text x="20" y="660">Provider pacing keeps work pending. Ordinary media checks yield to playback.</text><text x="20" y="690">Successful checks reset the relevant failure streak. In-use sources are protected during deletion.</text><text x="20" y="725">Accounts without remaining matching channels are also removed.</text></g></svg>
