name: Native apps
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  pull_request:
    paths:
      - '.github/workflows/native-downloads.yml'
      - 'packaging/*native*'
      - 'packaging/native/**'
      - 'cmd/antennarr/desktop*'
      - 'internal/desktopstats/**'
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-amd64, runner: macos-15-intel}
          - {target: windows-arm64, runner: ubuntu-24.04}
          - {target: windows-amd64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
      - name: Build the bundled FFmpeg and FFprobe
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *-amd64 ]] && ! command -v nasm >/dev/null; then
            if [[ "$RUNNER_OS" == macOS ]]; then brew install nasm; else sudo apt-get update && sudo apt-get install -y nasm; fi
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then export BUILD_JOBS=$(sysctl -n hw.ncpu); else export BUILD_JOBS=$(nproc); fi
          sh packaging/build-native-media.sh "$TARGET" "$RUNNER_TEMP/media"
      - name: Build the native app
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          source_version=$(sed -n 's/^ARG VERSION=//p' Dockerfile)
          test -n "$source_version"
          test -z "$RELEASE_VERSION" || test "$RELEASE_VERSION" = "$source_version"
          python3 packaging/build-native.py "$source_version" "$RUNNER_TEMP/downloads" --target "$TARGET" --media-dir "$RUNNER_TEMP/media"
      - name: Transfer Windows payload for installer compilation
        if: startsWith(matrix.target, 'windows-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload-${{ matrix.target }}
          path: ${{ runner.temp }}/downloads/*.zip
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - name: Keep the Mac disk image for testing and publication
        if: startsWith(matrix.target, 'macos-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/downloads/*.dmg
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  windows-installer:
    name: Package Windows ${{ matrix.arch }}
    needs: build
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payload-windows-${{ matrix.arch }}
          path: downloads
      - name: Compile the installer from the matching native payload
        env:
          ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Unexpected Inno Setup compiler digest.' }
          $toolsDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$toolsDir`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Compiler installation failed ($($install.ExitCode))." }
          $compiler = Join-Path $toolsDir 'ISCC.exe'
          $zip = Get-Item "downloads/antennarr-*-windows-$env:ARCH.zip"
          $version = $zip.BaseName -replace '^antennarr-', '' -replace "-windows-$env:ARCH$", ''
          $payload = Join-Path $env:RUNNER_TEMP 'payload'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $payload
          $out = New-Item -ItemType Directory installers
          & $compiler "/DAppVersion=$version" "/DAppArch=$env:ARCH" "/DPayloadDir=$payload" "/DOutputDir=$($out.FullName)" 'packaging/native/Antennarr.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-${{ matrix.arch }}
          path: installers/*-setup.exe
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  smoke:
    name: Test ${{ matrix.target }} on ${{ matrix.runner }}
    needs: [build, windows-installer]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-amd64, runner: macos-15-intel}
          - {target: windows-arm64, runner: windows-11-arm}
          - {target: windows-amd64, runner: windows-2025}
          - {target: windows-amd64, runner: windows-2022}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.target }}
          path: downloads
      - name: Extract, launch, tune, and restart the app on its target platform
        shell: bash
        env:
          ANTENNARR_TEST_FIREWALL: '1'
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then py=python; else py=python3; fi
          "$py" packaging/test-native.py downloads/*
