version: 2
# Dependabot's native rebasing remains enabled. Checking each weekday also
# refreshes stale PRs without unsupported commands from github-actions[bot].
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    groups:
      go-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    groups:
      container:
        patterns: ["*"]
    open-pull-requests-limit: 3
